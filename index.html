*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}

header.board{background:var(--board);color:var(--board-ink)}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.brand h1 span{color:var(--accent)}
.brand .sub{font-size:13px;opacity:.75}
.ligas{display:flex;gap:6px;flex-wrap:wrap}
.ligas button{font:600 14px var(--display);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--board-ink);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;cursor:pointer}
.ligas button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);border-top:1px solid rgba(255,255,255,.08)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--board-ink);opacity:.65;text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto}
table.tabla{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:560px}
.tabla th{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.tabla td{text-align:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.tabla tr:last-child td{border-bottom:0}
.tabla th.eq,.tabla td.eq{text-align:left}
.tabla td.pos{font:700 16px var(--display);width:36px;color:var(--muted)}
.tabla tr.lider td.pos{color:var(--gold)}
.tabla td.pts{font:800 18px var(--display)}
.tabla td.eq button{all:unset;cursor:pointer;font-weight:600}
.tabla td.eq button:hover{color:var(--accent)}
.tabla td.eq button:focus-visible{outline:2px solid var(--accent)}
.forma{display:inline-flex;gap:3px}
.f{width:18px;height:18px;border-radius:4px;font:700 11px/18px var(--display);color:#fff;text-align:center}
.f.G{background:var(--win)}.f.E{background:var(--draw)}.f.P{background:var(--loss)}

.gana{color:var(--accent)}

.goles th,.goles td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center}
.goles th{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.goles td:last-child{font:800 18px var(--display)}
.podio{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.podio h2{font-size:18px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.puesto{display:grid;grid-template-columns:36px 30px 1fr auto;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}

.puesto .p{font:800 18px var(--display);font-variant-numeric:tabular-nums}
.puesto.primero .n{font-size:16px}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.entrada .n.loc{text-align:right}
.entrada input{width:70px}
.entrada .g{font:800 20px var(--display);min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.pad{padding:16px}

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let ligaId=store.get("liga")||ESTADO.ligas[0].id;
if(!ESTADO.ligas.some(l=>l.id===ligaId))ligaId=ESTADO.ligas[0].id;
const liga=()=>ESTADO.ligas.find(l=>l.id===ligaId);
let puedeEditar=false, jornadaVista=null, jornadaApuntar=null, msg=null, sampleFn=null, sampleImg=null;

function golesEquipo(l,n,i){const r=l.resultados[n];if(!r)return null;
  if(r.puntos&&r.puntos[i]!=null&&r.puntos[i]!=="")return goles(r.puntos[i]);
  if(r.goles&&r.goles[i]!=null)return r.goles[i];return null}
function partidos(l,n){return(l.calendario[n]||[]).map(m=>{const[a,b]=m.split("-").map(Number);
  const ga=golesEquipo(l,n,a),gb=golesEquipo(l,n,b),r=l.resultados[n]||{},p=r.puntos||{};
  return{a,b,ga,gb,pa:p[a],pb:p[b],jugado:ga!=null&&gb!=null}})}
const totalJ=l=>Object.keys(l.calendario).length;
function jornadaActual(l){for(let n=1;n<=totalJ(l);n++){if(!partidos(l,n).every(p=>p.jugado))return n}return totalJ(l)}
function jugadas(l){let c=0;for(let n=1;n<=totalJ(l);n++){if(partidos(l,n).every(p=>p.jugado))c=n;else break}return c}
function clasificacion(l){
  const t=l.equipos.map((nombre,i)=>({i,nombre,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,forma:[]}));
  for(let n=1;n<=totalJ(l);n++)for(const m of partidos(l,n)){if(!m.jugado)continue;
    const A=t[m.a],B=t[m.b];A.pj++;B.pj++;A.gf+=m.ga;A.gc+=m.gb;B.gf+=m.gb;B.gc+=m.ga;
    if(m.ga>m.gb){A.g++;B.p++;A.pts+=3;A.forma.push("G");B.forma.push("P")}
    else if(m.ga<m.gb){B.g++;A.p++;B.pts+=3;B.forma.push("G");A.forma.push("P")}
    else{A.e++;B.e++;A.pts++;B.pts++;A.forma.push("E");B.forma.push("E")}}
  return t.sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||x.nombre.localeCompare(y.nombre,"es"))}

/* ---------- Vistas ---------- */
function vClasificacion(){const l=liga(),c=clasificacion(l);
  return `<div class="barra" style="justify-content:space-between"><h2>Clasificación · ${esc(l.nombre)}</h2><span class="muted small">Tras la jornada ${jugadas(l)} de ${totalJ(l)}</span></div>
  <div class="card scroll"><table class="tabla"><thead><tr><th>#</th><th class="eq">Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th class="col-gf">GF</th><th class="col-gc">GC</th><th>DG</th><th>Pts</th><th class="col-forma">Últimos 5</th></tr></thead><tbody>
  ${c.map((r,k)=>`<tr class="${k===0&&r.pj?"lider":""}"><td class="pos">${k+1}</td><td class="eq"><button data-equipo="${r.i}">${esc(r.nombre)}</button></td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td class="col-gf">${r.gf}</td><td class="col-gc">${r.gc}</td><td>${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td><td class="pts">${r.pts}</td><td class="col-forma"><span class="forma">${formaChips(r.forma)}</span></td></tr>`).join("")}
  </tbody></table></div>
  <p class="muted small">Victoria 3 puntos, empate 1. Si hay empate a puntos, decide la diferencia de goles y después los goles a favor. Pulsa un equipo para ver todos sus partidos.</p>`}
function formaChips(f){const u=f.slice(-5);let s="";for(let k=0;k<5-u.length;k++)s+='<span class="f vacio"></span>';
  return s+u.map(x=>`<span class="f ${x}" title="${{G:"Ganado",E:"Empatado",P:"Perdido"}[x]}">${x}</span>`).join("")}
function vJornadas(){const l=liga(),T=totalJ(l);if(!jornadaVista)jornadaVista=jornadaActual(l);const n=jornadaVista;
  const ps=partidos(l,n);
  return `<div class="card pad jsel"><button class="btn" data-jor="${n-1}" ${n<=1?"disabled":""} aria-label="Jornada anterior">‹</button>
  <div class="nombre">Jornada ${n}<div class="muted small" style="font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500">${ps.every(p=>p.jugado)?"Terminada":ps.some(p=>p.jugado)?"En curso":"Por jugar"}</div></div>
  <button class="btn" data-jor="${n+1}" ${n>=T?"disabled":""} aria-label="Jornada siguiente">›</button></div>
  <div class="card partidos">${ps.map(p=>`<div class="partido">
   <div class="loc"><div class="n ${p.jugado&&p.ga>p.gb?"gana":""}">${esc(l.equipos[p.a])}</div>${p.pa!=null&&p.pa!==""?`<div class="pf">${p.pa} pts</div>`:""}</div>
   <div class="marcador ${p.jugado?"":"pend"}">${p.jugado?`${p.ga}-${p.gb}`:"vs"}</div>
   <div class="vis"><div class="n ${p.jugado&&p.gb>p.ga?"gana":""}">${esc(l.equipos[p.b])}</div>${p.pb!=null&&p.pb!==""?`<div class="pf">${p.pb} pts</div>`:""}</div></div>`).join("")}</div>`}
function vGoles(){let filas="";for(let g=0;g<=20;g++){const d=g===0?0:50+(g-1)*9,h=g===0?49:d+8;filas+=`<tr><td>${d}–${h}</td><td>${g}</td></tr>`}
  return `<h2>Canje de goles</h2><p class="muted">Los puntos de Futmondo de cada jornada se convierten en goles. Con menos de 50 puntos no hay gol; a partir de 50, un gol más cada 9 puntos.</p>
  <div class="card pad stack"><label for="calc-pts" class="small muted">Calculadora</label><div class="calc"><input type="number" id="calc-pts" inputmode="numeric" placeholder="Puntos"><span>=</span><strong id="calc-res" style="font:800 24px var(--display)">0 goles</strong></div></div>
  <div class="card pad"><table class="goles"><thead><tr><th>Puntos</th><th>Goles</th></tr></thead><tbody>${filas}</tbody></table></div>`}
const COPA='<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M7 2h10v2h4v3.5A4.5 4.5 0 0 1 16.6 12a5.5 5.5 0 0 1-3.6 3.4V18h3.5v4h-9v-4H11v-2.6A5.5 5.5 0 0 1 7.4 12 4.5 4.5 0 0 1 3 7.5V4h4V2zm0 4H5v1.5a2.5 2.5 0 0 0 2 2.45V6zm10 0v3.95a2.5 2.5 0 0 0 2-2.45V6h-2z"/></svg>';
function vPalmares(){const med=[["oro","Oro"],["plata","Plata"],["bronce","Bronce"]];
  const fin=ESTADO.ligas.every(l=>jugadas(l)>=totalJ(l));
  return `<h2>Palmarés</h2><p class="muted small" style="margin:0">${fin?"Campeones de la temporada 26-27.":`Así va el podio de cada liga. Es provisional hasta que acabe la jornada 38.`}</p>
  <div class="podio">${ESTADO.ligas.map(l=>{const c=clasificacion(l).slice(0,3);
    return `<section class="card"><h2>${esc(l.nombre)}</h2><div class="muted small" style="padding:8px 16px 0">Tras la jornada ${jugadas(l)} de ${totalJ(l)}</div>${c.map((r,k)=>`<div class="puesto ${k?"":"primero"}"><span class="copa ${med[k][0]}" title="${med[k][1]}">${COPA}</span><span class="lugar">${k+1}º</span><span class="n">${esc(r.nombre)}</span><span class="p">${r.pts} pts</span></div>`).join("")}</section>`}).join("")}</div>`}
function vApuntar(){if(!puedeEditar)return `<div class="aviso">Solo el administrador puede apuntar puntos.</div>`;
  const T=Math.max(...ESTADO.ligas.map(totalJ));
  if(!jornadaApuntar)jornadaApuntar=Math.min(...ESTADO.ligas.map(jornadaActual));const n=jornadaApuntar;
  let opts="";for(let k=1;k<=T;k++)opts+=`<option value="${k}" ${k===n?"selected":""}>Jornada ${k}</option>`;
  const bloques=ESTADO.ligas.map(l=>{const ps=partidos(l,n),pt=(l.resultados[n]||{}).puntos||{};
    return `<section class="stack"><h2 style="font-size:18px">${esc(l.nombre)}</h2><div class="card">${ps.map(p=>`<div class="entrada">
   <label class="n loc" for="pt-${l.id}-${p.a}">${esc(l.equipos[p.a])}</label><input class="il" type="number" inputmode="numeric" id="pt-${l.id}-${p.a}" data-eq="${l.id}-${p.a}" value="${pt[p.a]??""}" placeholder="pts">
   <span class="g gl" id="g-${l.id}-${p.a}">${p.ga??"·"}</span>
   <span class="sep muted">–</span>
   <span class="g gv" id="g-${l.id}-${p.b}">${p.gb??"·"}</span>
   <input class="iv" type="number" inputmode="numeric" id="pt-${l.id}-${p.b}" data-eq="${l.id}-${p.b}" value="${pt[p.b]??""}" placeholder="pts"><label class="n vis" for="pt-${l.id}-${p.b}">${esc(l.equipos[p.b])}</label></div>`).join("")}</div></section>`}).join("");
  return `<div class="barra" style="justify-content:space-between"><h2>Apuntar puntos</h2><select id="ap-jor" aria-label="Jornada">${opts}</select></div>
  ${msg?`<div class="aviso ${msg.tipo}">${esc(msg.texto)}</div>`:""}
  ${sampleImg?`<div class="card pad stack"><label for="ap-capturas" style="font-weight:600">Leer capturas de Futmondo</label><p class="muted small" style="margin:0">Haz capturas de la clasificación de la jornada ${n} en Futmondo, con los 60 equipos y sus puntos, y súbelas todas juntas (hasta ${sampleImg.maxCount}). Claude lee los puntos y rellena las casillas de las 3 ligas. Revísalos y pulsa Guardar.</p><input type="file" id="ap-capturas" accept="${esc((sampleImg.mediaTypes||["image/*"]).join(","))}" multiple><span class="muted small" id="ap-cap-estado" aria-live="polite"></span></div>`:""}
  <p class="muted small">Escribe los puntos de Futmondo de cada equipo. Los goles se calculan solos. Puedes guardar la jornada a medias y completarla después.</p>
  <form id="ap-form" class="stack">${bloques}
  <details class="card pad"><summary style="cursor:pointer;font-weight:600">Pegar una lista de puntos</summary>
   <div class="stack" style="margin-top:10px"><p class="muted small" style="margin:0">Una línea por equipo con el nombre y los puntos, por ejemplo <code>WOKIS 72</code>. Rellena las casillas de arriba.</p>
   <textarea id="ap-pegar" aria-label="Lista de puntos"></textarea><div><button type="button" class="btn" id="ap-leer">Rellenar casillas</button></div></div></details>
  <div class="barra"><button type="submit" class="btn primario" id="ap-guardar">Guardar y descargar web</button><span class="muted small" id="ap-estado"></span></div></form>`}

/* ---------- Ficha de equipo ---------- */
function abrirEquipo(i){const l=liga();let li="";
  for(let n=1;n<=totalJ(l);n++){const p=partidos(l,n).find(x=>x.a===i||x.b===i);if(!p)continue;
    const casa=p.a===i,rival=casa?p.b:p.a,mis=casa?p.ga:p.gb,sus=casa?p.gb:p.ga;
    const res=p.jugado?(mis>sus?"G":mis<sus?"P":"E"):"";
    li+=`<li><span class="j">J${n}</span><span>${casa?"vs":"en"} ${esc(l.equipos[rival])}</span><span class="r">${p.jugado?`${mis}-${sus}`:""}</span>${res?`<span class="f ${res}">${res}</span>`:'<span class="f vacio"></span>'}</li>`}
  $("#hoja").innerHTML=`<header><h2>${esc(l.equipos[i])}</h2><button class="btn" id="cerrar">Cerrar</button></header><ol>${li}</ol>`;
  $("#velo").hidden=false;$("#cerrar").focus()}
function cerrar(){$("#velo").hidden=true}

/* ---------- Pintar ---------- */
const RUTAS={clasificacion:vClasificacion,jornadas:vJornadas,goles:vGoles,palmares:vPalmares,apuntar:vApuntar};
function ruta(){const h=location.hash.slice(1);return RUTAS[h]&&(h!=="apuntar"||puedeEditar)?h:"clasificacion"}
function pintar(){const l=liga(),r=ruta();
  $("#ligas").innerHTML=ESTADO.ligas.length>1?ESTADO.ligas.map(x=>`<button data-liga="${x.id}" aria-pressed="${x.id===ligaId}">${esc(x.nombre)}</button>`).join(""):"";
  $("#resumen").textContent=`${ESTADO.ligas.reduce((s,x)=>s+x.equipos.length,0)} managers · Jornada ${jornadaActual(l)} de ${totalJ(l)}`;
  $("#tab-apuntar").hidden=!puedeEditar;
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+r?"page":"false"));
  $("#vista").innerHTML=RUTAS[r]();const act=document.querySelector('#tabs a[aria-current="page"]');if(act&&act.scrollIntoView)try{act.scrollIntoView({block:"nearest",inline:"nearest"})}catch(e){}}

document.addEventListener("click",e=>{const t=e.target.closest("button,[data-equipo]");if(!t)return;
  if(t.dataset.liga){ligaId=t.dataset.liga;store.set("liga",ligaId);jornadaVista=jornadaApuntar=null;msg=null;pintar()}
  else if(t.dataset.jor){jornadaVista=Number(t.dataset.jor);pintar()}
  else if(t.dataset.equipo!=null&&t.dataset.equipo!==""&&t.closest(".tabla"))abrirEquipo(Number(t.dataset.equipo));
  else if(t.id==="cerrar")cerrar();
  else if(t.id==="ap-leer")leerLista()});
$("#velo").addEventListener("click",e=>{if(e.target.id==="velo")cerrar()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#velo").hidden)cerrar()});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="calc-pts"){const g=goles(t.value||0);$("#calc-res").textContent=`${g} ${g===1?"gol":"goles"}`}
  if(t.dataset&&t.dataset.eq!=null){const o=$("#g-"+t.dataset.eq);if(o)o.textContent=t.value===""?"·":goles(t.value)}});
document.addEventListener("change",e=>{if(e.target.id==="ap-jor"){jornadaApuntar=Number(e.target.value);msg=null;pintar()}
  else if(e.target.id==="ap-capturas")leerCapturas(e.target)});
window.addEventListener("hashchange",()=>{if(location.hash==="#admin"){store.set("lwm-admin","1");puedeEditar=true;location.hash="#apuntar";return}msg=null;pintar();window.scrollTo(0,0)});

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
function equiposJornada(){const r=[];for(const l of ESTADO.ligas)for(const p of partidos(l,jornadaApuntar))for(const i of[p.a,p.b])r.push({clave:l.id+"-"+i,nombre:l.equipos[i]});return r}
function rellenar(clave,v){const inp=$("#pt-"+clave);if(!inp)return false;inp.value=Math.floor(v);inp.dispatchEvent(new Event("input",{bubbles:true}));return true}
function leerLista(){const eqs=equiposJornada();let ok=0,fallo=[];
  for(const linea of $("#ap-pegar").value.split(/\n/)){const s=linea.trim();if(!s)continue;
    const m=s.match(/^(.*?)[\s:;,\t-]*(-?\d+(?:[.,]\d+)?)\s*(?:pts|puntos)?$/i);if(!m){fallo.push(s);continue}
    const nm=norm(m[1]);let e=eqs.find(x=>norm(x.nombre)===nm);
    if(!e&&nm.length>=3)e=eqs.find(x=>norm(x.nombre).includes(nm)||nm.includes(norm(x.nombre)));
    if(!e){fallo.push(s);continue}
    if(rellenar(e.clave,Number(m[2].replace(",","."))))ok++}
  $("#ap-estado").textContent=`${ok} equipos rellenados`+(fallo.length?`. No reconocidos: ${fallo.join(" · ")}`:"")}
async function leerCapturas(input){const files=[...input.files];if(!files.length||!sampleFn||!sampleImg)return;
  const eqs=equiposJornada(),porNombre=new Map(eqs.map(e=>[e.nombre,e.clave]));
  const est=$("#ap-cap-estado");input.disabled=true;est.textContent="Leyendo capturas…";
  const prompt="Estas imágenes son capturas de la app de fútbol fantasy Futmondo con los puntos que ha sacado cada equipo (manager) en una jornada.\n\nLista de equipos:\n"+eqs.map(e=>e.nombre).join("\n")+"\n\nPara cada equipo de la lista que aparezca en las capturas, dame los puntos de ESA JORNADA. Si la captura muestra también puntos totales de la temporada, usa solo los de la jornada. Los nombres de la captura pueden variar en mayúsculas, acentos, emojis o abreviaturas (por ejemplo \"QUILLO\" puede ser \"REC-QUILLO\" o \"DECKER\" puede ser \"DECKER MV\"): asígnalos al nombre exacto de la lista. Cada nombre de la captura corresponde como mucho a un equipo de la lista. Si un equipo no aparece o no se lee bien, no lo incluyas. No inventes nada.\n\nResponde solo con JSON: [{\"equipo\":\"NOMBRE EXACTO DE LA LISTA\",\"puntos\":72}]";
  try{const r=await sampleFn.json(prompt,{images:files.slice(0,sampleImg.maxCount)});
    const arr=Array.isArray(r)?r:(r&&Array.isArray(r.equipos)?r.equipos:[]);let ok=0;
    for(const x of arr){const c=porNombre.get(x&&x.equipo),v=Number(x&&x.puntos);if(c&&isFinite(v)&&rellenar(c,v))ok++}
    const falta=eqs.filter(e=>{const inp=$("#pt-"+e.clave);return inp&&inp.value===""}).map(e=>e.nombre);
    est.textContent=`${ok} de ${eqs.length} equipos leídos.`+(falta.length?` Faltan: ${falta.join(", ")}. Sube otra captura o escríbelos a mano.`:" Revisa los números y pulsa Guardar.")}
  catch(e){const c=e&&e.code;est.textContent=c==="not_granted"?"No has permitido que Claude lea las capturas en esta página. Escribe los puntos a mano o recarga la página para volver a permitirlo.":
    c==="rate_limited"?"Demasiadas lecturas seguidas. Espera un minuto y vuelve a subir las capturas.":
    c==="image_rejected"?"Alguna imagen no se pudo abrir. Usa capturas normales (PNG o JPG).":
    "No se pudieron leer las capturas. Prueba otra vez o escribe los puntos a mano."}
  finally{input.disabled=false;input.value=""}}

/* ---------- Guardar (la página se vuelve a publicar con los datos nuevos) ---------- */
let artifact=null;
function documento(){const json=JSON.stringify(ESTADO).replace(/</g,"\\u003c");
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${FUENTE.reset}</style></head><body>`+
   HEAD_LINKS+`<style id="estilos">${FUENTE.estilos}</style>\n`+FUENTE.cabecera+"\n"+NAV+
   `<script type="application/json" id="estado">${json}<\/script>\n<script id="programa">${FUENTE.programa}<\/script>\n</body></html>`}
document.addEventListener("submit",async e=>{if(e.target.id!=="ap-form")return;e.preventDefault();
  const n=jornadaApuntar,copia=JSON.stringify(ESTADO.ligas.map(l=>l.resultados[n]||null));
  for(const l of ESTADO.ligas){const r=l.resultados[n]||(l.resultados[n]={}),pt={};
    for(const p of partidos(l,n))for(const i of[p.a,p.b]){const inp=$("#pt-"+l.id+"-"+i);if(inp&&inp.value!=="")pt[i]=Math.floor(Number(inp.value))}
    if(Object.keys(pt).length)r.puntos=pt;else delete r.puntos;
    if(!r.puntos&&!r.goles)delete l.resultados[n]}
  const b=$("#ap-guardar");b.disabled=true;$("#ap-estado").textContent="Guardando…";
  try{const url=URL.createObjectURL(new Blob([documento()],{type:"text/html"}));const a=document.createElement("a");a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
    msg={tipo:"ok",texto:`Jornada ${n} apuntada. Se ha descargado el archivo index.html: súbelo a Netlify (Deploys → arrastrar el archivo) para que lo vean todos.`};pintar()}
  catch(err){JSON.parse(copia).forEach((r,k)=>{if(r)ESTADO.ligas[k].resultados[n]=r;else delete ESTADO.ligas[k].resultados[n]});
    const c=err&&err.code;msg={tipo:"error",texto:c==="conflict"?"Otra persona guardó a la vez. La página se ha recargado con su versión; vuelve a escribir los puntos.":
      c==="not_granted"||c==="not_writer"?"No tienes permiso para guardar. Solo el administrador puede apuntar puntos.":"No se pudo guardar. Revisa la conexión y vuelve a pulsar Guardar."};pintar()}});

pintar();
(function(){const k="lwm-admin";if(location.hash==="#admin"){store.set(k,"1");puedeEditar=true;location.hash="#apuntar";return}
  puedeEditar=store.get(k)==="1";if(puedeEditar)pintar()})();
})();
</script>
</body></html>
